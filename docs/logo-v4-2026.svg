<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Groove Academy 2026">
  <title>Groove Academy — 2026</title>
  <!-- Simple clean lines: ring + crossed drumsticks + G (9h) / A (3h) + 2026 (6h) -->
  <!-- Sticks are centered on the ring and slightly overshoot it (~9% of radius) top & bottom -->
  <g fill="none" stroke="#111111" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- ring -->
    <circle cx="256" cy="256" r="150"/>

    <!-- crossed drumsticks, beads at top, butts at bottom, breaking the frame (~15% overshoot) -->
    <g fill="#ffffff">
      <g transform="translate(256 256) rotate(34)">
        <path d="M -6 170 L 6 170 L 3 -158 L -3 -158 Z"/>
        <circle cx="0" cy="-164" r="9"/>
      </g>
      <g transform="translate(256 256) rotate(-34)">
        <path d="M -6 170 L 6 170 L 3 -158 L -3 -158 Z"/>
        <circle cx="0" cy="-164" r="9"/>
      </g>
    </g>
  </g>

  <!-- Letters: G at 9 o'clock, A at 3 o'clock -->
  <g fill="#111111" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="80" text-anchor="middle">
    <text x="181" y="284">G</text>
    <text x="331" y="284">A</text>
  </g>

  <!-- 2026 at 6 o'clock -->
  <g fill="#111111" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="4" text-anchor="middle">
    <text x="256" y="372">2026</text>
  </g>
</svg>
