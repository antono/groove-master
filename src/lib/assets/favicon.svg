<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Groove Academy">
	<title>Groove Academy</title>
	<!-- The hero mark (static/logo.svg) reduced for tab-bar sizes. Three changes,
	     all forced by the 16px render: the "G A" and "2026" text is dropped, the
	     sticks are solid instead of outlined (an outlined stick leaves a sliver
	     of fill too thin to see), and they stop short of the ring instead of
	     crossing it, so gold gaps keep the X and the circle apart. Inverted onto
	     a gold tile like the header's .brand-mark, so it holds up on a light or
	     a dark tab bar instead of dissolving into one of them. -->
	<rect width="512" height="512" rx="104" fill="#f0c040" />
	<circle cx="256" cy="256" r="186" fill="none" stroke="#0e0f17" stroke-width="32" />
	<g fill="#0e0f17">
		<g transform="translate(256 256) rotate(34)">
			<path d="M -22 150 L 22 150 L 13 -134 L -13 -134 Z" />
			<circle cx="0" cy="-142" r="16" />
		</g>
		<g transform="translate(256 256) rotate(-34)">
			<path d="M -22 150 L 22 150 L 13 -134 L -13 -134 Z" />
			<circle cx="0" cy="-142" r="16" />
		</g>
	</g>
</svg>
